<div id="masha-storefront-wrapper">
    <style>
    #masha-storefront-wrapper {
        --bg-primary: #070707;
        --bg-secondary: #0e0e10;
        --bg-tertiary: #161619;
        --bg-card: rgba(20, 20, 24, 0.7);
        --accent: #dfba73;
        --accent-light: #f3d498;
        --text-primary: #f5f5f7;
        --text-secondary: #aaaaaf;
        --text-muted: #75757a;
        --border-color: rgba(223, 186, 115, 0.18);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --font-serif: 'Cormorant Garamond', Georgia, serif;
        --font-sans: 'Inter', system-ui, sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-sans);
        padding: 2rem;
    }

    #masha-storefront-wrapper * { box-sizing: border-box; }

    .ms-tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.25em; color: var(--accent); display: block; margin-bottom: 0.5rem; }
    .ms-title { font-family: var(--font-serif); font-size: 2.8rem; line-height: 1.15; margin-bottom: 1rem; color: #fff; }

    .ms-controls { background: var(--bg-card); border: 1px solid var(--border-subtle); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2.5rem; }
    .ms-search-row { display: flex; gap: 1rem; }
    .ms-search-row input { flex: 1; background: var(--bg-tertiary); border: 1px solid var(--border-subtle); padding: 0.8rem 1rem; color: #fff; outline: none; }
    .ms-search-row select { background: var(--bg-tertiary); border: 1px solid var(--border-subtle); color: #fff; padding: 0.8rem 1rem; outline: none; }

    .ms-filter-row { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; }
    .ms-pills { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .ms-btn { background: var(--bg-tertiary); border: 1px solid var(--border-subtle); color: var(--text-secondary); padding: 0.5rem 1rem; font-size: 0.8rem; cursor: pointer; }
    .ms-btn.active { background: var(--accent); color: #000; font-weight: 600; }

    .ms-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
    .ms-card { background: var(--bg-secondary); border: 1px solid var(--border-subtle); cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; }
    .ms-card:hover { border-color: var(--border-color); transform: translateY(-5px); }
    .ms-img-box { width: 100%; aspect-ratio: 4/5; overflow: hidden; background: #000; }
    .ms-img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .ms-card:hover .ms-img-box img { transform: scale(1.05); }
    .ms-info { padding: 1.2rem; display: flex; flex-direction: column; flex: 1; }
    .ms-item-title { font-family: var(--font-serif); font-size: 1.2rem; margin-bottom: 0.4rem; color: #fff; }
    .ms-item-price { font-family: var(--font-serif); font-size: 1.1rem; color: var(--accent); margin-bottom: 1rem; }
    .ms-inquire-btn { width: 100%; padding: 0.6rem; background: var(--bg-tertiary); border: 1px solid var(--border-subtle); color: var(--text-secondary); text-transform: uppercase; font-size: 0.75rem; cursor: pointer; }
    .ms-inquire-btn:hover { background: var(--accent); color: #000; }

    @media (max-width: 900px) { .ms-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .ms-grid { grid-template-columns: 1fr; } }
    </style>

    <div style="text-align: center; margin-bottom: 2.5rem;">
        <span class="ms-tag">San Francisco Studio Originals</span>
        <h2 class="ms-title">Available Masterpieces</h2>
    </div>

    <div class="ms-controls">
        <div class="ms-search-row">
            <input type="text" id="ms-search" placeholder="Search pieces (Gorget, Coral, Amber, Necklace)...">
            <select id="ms-sort">
                <option value="featured">Featured Order</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name-asc">Name: A to Z</option>
            </select>
        </div>

        <div class="ms-filter-row">
            <div class="ms-pills" id="ms-cat-pills">
                <button class="ms-btn active" data-filter="all">All Pieces</button>
                <button class="ms-btn" data-filter="necklaces">Necklaces & Collars</button>
                <button class="ms-btn" data-filter="earrings">Earrings</button>
            </div>
            <div class="ms-pills" id="ms-price-pills">
                <button class="ms-btn active" data-price="all">All Prices</button>
                <button class="ms-btn" data-price="under-500">Under $500</button>
                <button class="ms-btn" data-price="500-2000">$500 – $2,000</button>
                <button class="ms-btn" data-price="above-2000">$2,000+</button>
            </div>
        </div>
    </div>

    <div id="ms-grid" class="ms-grid"></div>
</div>

      { id: "24", title: "Masha Archer Howlite Earrings", category: "earrings", price: "$225.00", pNum: 225, img: "https://images.squarespace-cdn.com/content/v1/56df36ce2fe1316ffbfe01f6/1757035551060-33KCAUCTX111TKXKONLF/2C5707C5-44FE-4E84-AFA7-C918D5F6765B.jpeg" }
    ];

    function render() {
        const grid = document.getElementById('ms-grid');
        if (!grid) return;
        const q = (document.getElementById('ms-search').value || '').toLowerCase().trim();
        const catBtn = document.querySelector('#ms-cat-pills .ms-btn.active');
        const priceBtn = document.querySelector('#ms-price-pills .ms-btn.active');
        const sortVal = document.getElementById('ms-sort').value;

        const cat = catBtn ? catBtn.dataset.filter : 'all';
        const pr = priceBtn ? priceBtn.dataset.price : 'all';

        let list = ITEMS.filter(item => {
            const matchCat = cat === 'all' || item.category === cat;
            let matchPrice = true;
            if (pr === 'under-500') matchPrice = item.pNum < 500;
            else if (pr === '500-2000') matchPrice = item.pNum >= 500 && item.pNum <= 2000;
            else if (pr === 'above-2000') matchPrice = item.pNum > 2000;
            const matchSearch = q === '' || item.title.toLowerCase().includes(q);
            return matchCat && matchPrice && matchSearch;
        });

        if (sortVal === 'price-asc') list.sort((a,b) => a.pNum - b.pNum);
        else if (sortVal === 'price-desc') list.sort((a,b) => b.pNum - a.pNum);
        else if (sortVal === 'name-asc') list.sort((a,b) => a.title.localeCompare(b.title));

        grid.innerHTML = list.map(item => `
            <div class="ms-card" onclick="window.location.href='mailto:studio@mashaarcher.com?subject=Inquiry:%20${encodeURIComponent(item.title)}'">
                <div class="ms-img-box">
                    <img src="${item.img}" alt="${item.title}" loading="lazy">
                </div>
                <div class="ms-info">
                    <h4 class="ms-item-title">${item.title}</h4>
                    <span class="ms-item-price">${item.price}</span>
                    <button class="ms-inquire-btn">Acquire / Inquire</button>
                </div>
            </div>
        `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('ms-search').addEventListener('input', render);
        document.getElementById('ms-sort').addEventListener('change', render);

        document.querySelectorAll('#ms-cat-pills .ms-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#ms-cat-pills .ms-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                render();
            };
        });

        document.querySelectorAll('#ms-price-pills .ms-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#ms-price-pills .ms-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                render();
            };
        });

        render();
    });
})();
</script>
